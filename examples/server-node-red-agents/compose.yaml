services:
  api:
    build:
      context: ../..
      dockerfile: examples/server-node-red-agents/Dockerfile
    init: true
    environment:
      API_TOKEN: ${API_TOKEN:-dev-token}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal-observer-demo-token}
      WORKER_URL: http://node-red:1881
      MAX_WORKERS: ${MAX_WORKERS:-4}
    volumes:
      - api-data:/workspace-data
      - projects:/data/projects
      - global-work:/data/agent-work
    ports:
      - target: 3094
        host_ip: 127.0.0.1
  node-red:
    build:
      context: ../..
      dockerfile: examples/server-node-red-agents/node-red/Dockerfile
    environment:
      DEFAULT_MODEL: ${DEFAULT_MODEL-opencode/big-pickle}
      API_TOKEN: ${API_TOKEN:-dev-token}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal-observer-demo-token}
      MAX_WORKERS: ${MAX_WORKERS:-4}
      NODE_RED_WORKER_METRICS: ${NODE_RED_WORKER_METRICS:-false}
      WORKER_TIMEOUT_MS: ${WORKER_TIMEOUT_MS:-450000}
    volumes:
      - node-red-data:/data
      - projects:/data/projects
      - global-work:/data/agent-work
      - ../../.home:/home-seed:ro
    depends_on:
      api:
        condition: service_started
    # Supervisor and internal callback ports stay on the Compose network.
volumes:
  api-data:
  node-red-data:
  projects:
  global-work:
