services:
  api:
    build:
      context: ../..
      dockerfile: examples/server-node-red-agents/Dockerfile
    init: true
    environment:
      API_TOKEN: ${API_TOKEN:-dev-token}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal-observer-demo-token}
      NODE_RED_ADMIN_TOKEN: ${NODE_RED_ADMIN_TOKEN:-internal-admin-demo-token}
      NODE_RED_URL: http://node-red:1880
      WORKER_URL: http://node-red:1881
      MAX_WORKERS: ${MAX_WORKERS:-4}
    volumes:
      - api-data:/workspace-data
      - projects:/data/projects
      - global-work:/data/agent-work
    ports:
      - target: 3094
        host_ip: 127.0.0.1
  node-red:
    build:
      context: ../..
      dockerfile: examples/server-node-red-agents/node-red/Dockerfile
    environment:
      API_TOKEN: ${API_TOKEN:-dev-token}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal-observer-demo-token}
      NODE_RED_ADMIN_TOKEN: ${NODE_RED_ADMIN_TOKEN:-internal-admin-demo-token}
      MAX_WORKERS: ${MAX_WORKERS:-4}
    volumes:
      - node-red-data:/data
      - projects:/data/projects
      - global-work:/data/agent-work
    depends_on:
      api:
        condition: service_started
    # Admin API and internal callback port are only reachable on the Compose network.
volumes:
  api-data:
  node-red-data:
  projects:
  global-work:
