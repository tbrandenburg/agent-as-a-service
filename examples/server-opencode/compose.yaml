services:
  server-opencode:
    build:
      context: ../..
      dockerfile: examples/server-opencode/Dockerfile
    init: true
    environment:
      API_TOKEN: ${API_TOKEN:-dev-token}
      HOST: 0.0.0.0
      PORT: "3092"
      OPENCODE_DIR: /workspace
      OPENCODE_MODEL: opencode/big-pickle
    ports:
      - "127.0.0.1:3092:3092"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3092/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
