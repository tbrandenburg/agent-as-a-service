name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    name: Checks / Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: make install
      - run: make security

  lint:
    name: Checks / Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: make install
      - run: make lint
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-structure
          path: data/quality/structure.json
          if-no-files-found: error

  format:
    name: Checks / Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: make install
      - run: make format-check

  tests:
    name: Checks / Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: make install
      - run: make typecheck
      - run: make test
      - run: make validate-openapi
      - run: make parity
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-runtime
          path: data/quality/*.json
          if-no-files-found: error

  quality-coverage:
    name: Checks / Quality coverage
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEFAULT_MODEL: github-copilot/gpt-6-luna
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: make install
      - run: make quality-test quality-coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-coverage
          path: data/quality/
          if-no-files-found: error
